name: Build DEB
on:
  workflow_dispatch:
  workflow_call:

jobs:
  deb:
    name: DEB
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y build-essential devscripts equivs git
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build DEB
        run: |
          cp -r packaging/debian debian
          mk-build-deps -i -r -t 'apt-get -y --no-install-recommends' debian/control
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../*.deb dist/
      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnome-equalizer-deb
          path: dist/*.deb
