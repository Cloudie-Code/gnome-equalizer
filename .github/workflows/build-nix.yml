name: Build Nix
on:
  workflow_dispatch:
  workflow_call:

jobs:
  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build
        run: nix build -L .#default
      - name: Check flake
        run: nix flake check
