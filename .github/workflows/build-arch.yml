name: Build Arch package
on:
  workflow_dispatch:
  workflow_call:

jobs:
  arch:
    name: Arch
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm base-devel git
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build package
        run: |
          git config --global --add safe.directory '*'
          VERSION=$(. packaging/arch/PKGBUILD && echo "$pkgver")
          mkdir -p /tmp/pkg
          cp packaging/arch/PKGBUILD /tmp/pkg/
          # Build the checked out tree instead of downloading the tag.
          git archive --format=tar.gz --prefix="gnome-equalizer-${VERSION}/" \
            -o /tmp/pkg/gnome-equalizer-${VERSION}.tar.gz HEAD
          chown -R builder /tmp/pkg
          cd /tmp/pkg && sudo -u builder makepkg -s --noconfirm
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp /tmp/pkg/*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: gnome-equalizer-arch
          path: dist/*.pkg.tar.zst
